name: failure-and-recovery-demo
on:
  workflow_dispatch:
  push:
    branches: [demo/failure-scenario]

jobs:
  failure-and-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Démarrer les dépendances locales
        run: |
          docker compose up -d postgres s3
          until docker compose exec -T postgres pg_isready -U pipeline -d transactions && curl -fsS http://localhost:9000/health >/dev/null; do sleep 2; done
      - name: Provoquer l’échec CSV puis corriger et relancer
        env:
          DATABASE_URL: postgresql://pipeline:pipeline-local-only@localhost:5432/transactions
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: localaccesskey
          S3_SECRET_KEY: localsecretkey123
          S3_BUCKET: transactions
          AWS_REGION: eu-west-3
        run: python -m scripts.failure_demo
      - name: Archiver les journaux de preuve
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-and-recovery-logs
          path: docs/evidence/*.log
          if-no-files-found: error
      - if: always()
        run: docker compose down -v
